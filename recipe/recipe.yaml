schema_version: 1

context:
  name: langsmith
  version: 0.14.12

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/langsmith-${{ version }}.tar.gz
  sha256: b4d6a24ed74333095da476803ad9d22ee35f9dae1052cebf1e366d3889a9b675

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-fancy-pypi-readme
    - pip
  run:
    - httpx2 >=2,<3
    - anyio >=3.5.0,<5
    - distro >=1.7.0,<2
    - sniffio
    - typing_extensions >=4.14,<5
    - websockets >=15.0
    - python-xxhash >=3.0.0
    - uuid-utils >=0.12.0,<1.0
    - python >=${{ python_min }},<4.0
    - pydantic >=2,<3
    - requests >=2.0.0
    - orjson >=3.9.14
    - requests-toolbelt >=1.0.0
    - zstandard >=0.23.0
    - packaging >=23.2
  run_constraints:
    - langsmith-pyo3 >=0.1.0rc2,<0.2.0
    - rich >=13.9.4
    - pytest >=7.0.0
    - openai-agents >=0.0.3,<0.1
    - opentelemetry-sdk >=1.30.0,<2.0.0
    - opentelemetry-api >=1.30.0,<2.0.0
    - opentelemetry-exporter-otlp-proto-http >=1.30.0,<2.0.0

tests:
  - python:
      imports:
        - langsmith
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Client library to connect to the LangSmith LLM Tracing and Evaluation Platform.
  description: |
    LangSmith helps you visualize and evaluate language model applications to help you build better
    performing applications. This is the client library to connect to the LangSmith API.
  license: MIT
  license_file: LICENSE
  homepage: https://smith.langchain.com/
  repository: https://github.com/langchain-ai/langsmith-sdk
  documentation: https://docs.smith.langchain.com/docs/

extra:
  recipe-maintainers:
    - pavelzw
    - hinthornw
    - vowelparrot
    - jan-janssen
